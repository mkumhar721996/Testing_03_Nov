components:
  comp_application_api:
    mode: local
    e2e_command: cd services/api && pnpm e2e
    test_command: cd services/api && pnpm test
    build_command: cd services/api && pnpm build
    devloop_command: cd services/api && pnpm devloop
    install_command: cd services/api && pnpm add {name}@{version}
  comp_web_app:
    mode: local
    e2e_command: cd apps/web && pnpm e2e
    test_command: cd apps/web && pnpm test
    build_command: cd apps/web && pnpm build
    devloop_command: cd apps/web && pnpm devloop
    install_command: cd apps/web && pnpm add {name}@{version}
commands:
  test: (cd services/api && pnpm test) && (cd apps/web && pnpm test)
  build: (cd services/api && pnpm build) && (cd apps/web && pnpm build)
  devloop: (cd services/api && pnpm devloop) && (cd apps/web && pnpm devloop)
setup_command: (cd apps/web && pnpm install --frozen-lockfile) && (cd services/api
  && pnpm install --frozen-lockfile)
toolchain:
  node: '22'
  pnpm: 12.9.1
package_install_commands:
  pnpm: pnpm add {name}@{version}
